[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tidyup"
version = "1.0.0"
description = "Clean a messy folder in one command. Preview first, undo anytime."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tidyup = "tidyup:main"

[tool.setuptools]
py-modules = ["tidyup"]
